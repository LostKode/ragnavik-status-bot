name: Publish worker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          version=${GITHUB_REF_NAME#v}
          docker build -t "ghcr.io/$repository:$version" .
          docker push "ghcr.io/$repository:$version"
